<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>墨水屏翻页测试页</title>
  <style>
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      padding: 0 18px 40vh;
      font: 18px/1.9 Georgia, "Noto Serif CJK SC", serif;
      color: #111;
      background: #fff;
    }
    h1 { margin-top: 32px; font-size: 28px; }
    .smooth-card {
      width: 100%;
      height: 90px;
      margin: 20px 0;
      background: #ddd;
      transition: background-color 2s linear, transform 2s linear;
    }
    .smooth-card.changed {
      background: #000;
      transform: translateX(20px);
    }
    .spacer { height: 1500px; }
    .marker { font-weight: bold; }
    .pulse {
      width: 32px;
      height: 32px;
      background: #000;
      animation: pulse 3s infinite;
    }
    @keyframes pulse {
      50% { opacity: .1; }
    }
  </style>
</head>
<body>
  <h1>整页翻页测试</h1>
  <p>第一屏。点击右侧“翻页：关”开启模式，再点击“下一页”或“上一页”。</p>
  <div class="smooth-card"></div>
  <div class="pulse"></div>
  <p id="top-marker" class="marker">PAGE-TOP</p>
  <div class="spacer"></div>
  <p class="marker">MIDDLE-SECTION</p>
  <div class="spacer"></div>
  <p class="marker">LOWER-SECTION</p>
  <div class="spacer"></div>
  <p id="bottom-marker" class="marker">PAGE-BOTTOM</p>
  <div class="spacer"></div>
</body>
</html>
