<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内部滚动容器测试</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font: 18px/1.9 Georgia, serif; background: #fff; }
    #reader {
      height: 100vh;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 0 18px;
      box-sizing: border-box;
    }
    .spacer { height: 1500px; }
    .marker { font-weight: bold; }
  </style>
</head>
<body>
  <main id="reader">
    <h1>内部滚动容器</h1>
    <p>有些阅读站使用固定高度的内部滚动区域，这个页面用于验证自动识别。</p>
    <p class="marker">INNER-TOP</p>
    <div class="spacer"></div>
    <p class="marker">INNER-MIDDLE</p>
    <div class="spacer"></div>
    <p class="marker">INNER-LOWER</p>
    <div class="spacer"></div>
    <p class="marker">INNER-BOTTOM</p>
  </main>
</body>
</html>
